
[package]
edition = "2024"
rust-version = "1.88.0"
name = "libp2p-yamux"
version = "0.48.0"
authors = ["Parity Technologies <admin@parity.io>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Yamux multiplexing protocol for libp2p"
readme = false
keywords = [
    "peer-to-peer",
    "libp2p",
    "networking",
]
categories = [
    "network-programming",
    "asynchronous",
]
license = "MIT"
repository = "https://github.com/libp2p/rust-libp2p"
resolver = "2"

[package.metadata.docs.rs]
all-features = true

[lib]
name = "libp2p_yamux"
path = "src/lib.rs"

[dependencies.futures]
version = "0.3.34"

[dependencies.libp2p-core]
version = "0.44.0"

[dependencies.thiserror]
version = "2.0.21"

[dependencies.tracing]
version = "0.1.44"

[dependencies.yamux]
version = "0.14.1"

[lints.clippy]
dbg_macro = "warn"
manual_let_else = "warn"
type_complexity = "allow"
unnecessary_wraps = "warn"
used_underscore_binding = "warn"

[lints.clippy.pedantic]
level = "allow"
priority = -1

[lints.rust]
unreachable_pub = "warn"

[[test]]
name = "compliance"
path = "tests/compliance.rs"

[dev-dependencies]
tokio = { version = "1.53.3", default-features = false, features = ["macros", "rt", "io-util"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
futures-timer = "3.0.3"
