[package]
name = "g2pool"
version = "0.1.0"
repository = "https://github.com/G2Pool/G2Pool"
edition = "2021"
description = "P2Pool implementation for Grin"
license = "Unlicense"
publish = false
default-run = "g2pool"

[[bin]]
name = "g2pool"
path = "src/bin/g2pool.rs"

[dependencies]
im = "15.1.0"
blake2 = { package = "blake2-rfc", version = "0.2.18" }
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["osc52"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ratatui-textarea = { version = "0.9.3", default-features = false, features = ["crossterm"] }
log = { version = "0.4.34", features = ["std"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage"] }
directories = "6.0.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
tokio = { version = "1.53.3", features = ["sync", "macros", "rt", "time"] }
libp2p = { version = "=0.57.1", default-features = false, features = ["tcp", "tokio", "noise", "yamux", "request-response", "ping", "ed25519", "macros", "pnet"] }
fs2 = "0.4.3"
grin_chain = "=5.5.2"
grin_core = "=5.5.2"
grin_keychain = "=5.5.2"
grin_servers = "=5.5.2"
grin_util = "=5.5.2"
grin_pool = "=5.5.2"
rand = "0.10.3"
heed = "=0.22.1"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
semver = "1.0.28"
serde_json = "1.0.154"
anyhow = "1.0.104"

grin_wallet_api = "=5.5.1"
grin_wallet_impls = "=5.5.1"
grin_wallet_libwallet = "=5.5.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
atomic-write-file = "0.3.1"

[patch.crates-io]
libp2p-yamux = { path = "vendor/libp2p-yamux" }

[dev-dependencies]
tempfile = "3.27.0"

[workspace]
members = ["vendor/libp2p-yamux"]
resolver = "2"
